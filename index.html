<!DOCTYPE html>
<html lang="it" data-theme="light">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Alessandro Persiano</title>
        
        <!-- Favicon -->
        <link rel="icon" type="image/svg+xml" href="favicon.svg">
        <meta name="facebook-domain-verification" content="xrtnq39tpwwwa203dylhfu0byeb68c" />
        
        <!-- Primary Meta Tags -->
        <meta name="title" content="Alessandro Persiano">
        <meta name="description" content="Alessandro Persiano, aka appersiano. AI Product & Software Engineer. Prodotti digitali, sperimentazione e community. Per una consulenza: etnatech.it.">
        
        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website">
        <meta property="og:url" content="https://www.appersiano.com/">
        <meta property="og:title" content="Alessandro Persiano">
        <meta property="og:description" content="Alessandro Persiano, aka appersiano. AI Product & Software Engineer. Prodotti digitali, sperimentazione e community. Per una consulenza: etnatech.it.">
        <meta property="og:image" content="https://avatars.githubusercontent.com/appersiano">
        
        <!-- Twitter -->
        <meta property="twitter:card" content="summary_large_image">
        <meta property="twitter:url" content="https://www.appersiano.com/">
        <meta property="twitter:title" content="Alessandro Persiano">
        <meta property="twitter:description" content="Alessandro Persiano, aka appersiano. AI Product & Software Engineer. Prodotti digitali, sperimentazione e community. Per una consulenza: etnatech.it.">
        <meta property="twitter:image" content="https://avatars.githubusercontent.com/appersiano">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Syne:wght@500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <link rel="stylesheet" href="css/styles.css">
        <script>
            (function () {
                try {
                    var theme = localStorage.getItem('theme');
                    if (theme === 'dark' || theme === 'light') {
                        document.documentElement.setAttribute('data-theme', theme);
                    }
                } catch (e) { /* ignore */ }
            })();
        </script>
    </head>
    <body>
        <div class="atmosphere" aria-hidden="true">
            <div class="orb orb-a"></div>
            <div class="orb orb-b"></div>
            <div class="orb orb-c"></div>
            <div class="grid"></div>
            <div class="noise"></div>
        </div>

        <button class="theme-toggle" aria-label="Toggle dark mode" type="button">
            <i class="fas fa-moon"></i>
        </button>

        <main class="content">
            <header class="hero">
                <div class="avatar-wrap">
                    <span class="avatar-ring" aria-hidden="true"></span>
                    <img
                        src="https://avatars.githubusercontent.com/appersiano"
                        alt="Alessandro Persiano"
                        class="avatar"
                        width="148"
                        height="148"
                        onclick="handleAvatarClick(event)"
                    >
                </div>
                <h1 class="brand"><span>Alessandro Persiano</span>appersiano</h1>
                <div id="typewriter"></div>
                <div class="social-links">
                    <a href="https://github.com/appersiano" target="_blank" rel="noopener noreferrer" title="GitHub" aria-label="GitHub">
                        <i class="fab fa-github"></i>
                    </a>
                    <a href="https://linkedin.com/in/alessandro-persiano" target="_blank" rel="noopener noreferrer" title="LinkedIn" aria-label="LinkedIn">
                        <i class="fab fa-linkedin"></i>
                    </a>
                    <a href="https://medium.com/@appersiano" target="_blank" rel="noopener noreferrer" title="Medium" aria-label="Medium">
                        <i class="fab fa-medium"></i>
                    </a>
                </div>
            </header>

            <div class="sections">
                <div class="tabs">
                    <button class="tab active" type="button" data-tab="experiments" onclick="openTab(event, 'experiments')">Esperimenti</button>
                    <button class="tab" type="button" data-tab="blog" onclick="openTab(event, 'blog')">Post</button>
                    <button class="tab" type="button" data-tab="talks" onclick="openTab(event, 'talks')">Talk</button>
                    <button class="tab" type="button" data-tab="community" onclick="openTab(event, 'community')">Community</button>
                    <span class="tab-indicator" aria-hidden="true"></span>
                </div>

                <div id="experiments" class="section active"></div>
                <div id="blog" class="section"></div>
                <div id="talks" class="section"></div>
                <div id="community" class="section"></div>
            </div>
        </main>

        <script src="https://unpkg.com/grapheme-splitter@1.0.4/index.js"></script>
        <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/dist/bundles/anime.umd.min.js"></script>
        <script src="js/site.js"></script>
    </body>
</html>
